<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقية الحساب لمقدم خدمة - خدمتي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="premium-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
</head>

<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="index.html" class="logo">
                        <span class="logo-icon">🛠️</span>
                        <span class="logo-text">خدمتي</span>
                    </a>
                    <h2>انضم كمقدم خدمة</h2>
                    <p>قم بترقية حسابك وابدأ باستقبال الطلبات</p>
                </div>

                <form id="upgradeForm" onsubmit="handleUpgrade(event)">
                    <div class="form-group">
                        <label>الاسم الكامل</label>
                        <input type="text" id="fullName" required readonly class="readonly-input">
                    </div>

                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <div class="phone-input-wrapper">
                            <input type="tel" id="phone" placeholder="790000000" pattern="[0-9]{9}" required>
                            <span class="country-code">+962</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>المهنة / التخصص</label>
                        <select id="specialty" required>
                            <option value="">اختر التخصص...</option>
                            <option value="سباكة">سباكة</option>
                            <option value="كهرباء">كهرباء</option>
                            <option value="نجارة">نجارة</option>
                            <option value="تنظيف">تنظيف</option>
                            <option value="تكييف">تكييف</option>
                            <option value="دهان">دهان</option>
                            <option value="نقل عفش">نقل عفش</option>
                            <option value="ستلايت">ستلايت</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>المدينة</label>
                        <select id="city" required>
                            <option value="">اختر المدينة...</option>
                            <option value="عمّان">عمّان</option>
                            <option value="الزرقة">الزرقة</option>
                            <option value="إربد">إربد</option>
                            <option value="العقبة">العقبة</option>
                            <option value="السلط">السلط</option>
                            <option value="مادبا">مادبا</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>نبذة عنك (اختياري)</label>
                        <textarea id="bio" placeholder="اكتب نبذة مختصرة عن خبرتك وخدماتك..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">ترقية الحساب</button>
                    <div class="auth-footer">
                        <a href="customer-dashboard.html">تراجع للوحة التحكم</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Check session and load user data
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            // Get Bio/Details
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (profile) {
                document.getElementById('fullName').value = profile.full_name || '';
                if (profile.role === 'provider') {
                    alert('حسابك مفعل كمقدم خدمة بالفعل!');
                    window.location.href = 'dashboard.html';
                }
            }
        });

        async function handleUpgrade(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'جاري الترقية...';

            const phone = document.getElementById('phone').value;
            const fullPhone = '+962' + phone;
            const specialty = document.getElementById('specialty').value;
            const city = document.getElementById('city').value;
            const bio = document.getElementById('bio').value;

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();

                // 1. Update Profile Role
                const { error: profileError } = await supabaseClient
                    .from('profiles')
                    .update({
                        role: 'provider',
                        phone: fullPhone
                    })
                    .eq('id', session.user.id);

                if (profileError) throw profileError;

                // 2. Insert into Providers
                const { error: providerError } = await supabaseClient
                    .from('providers')
                    .insert({
                        user_id: session.user.id,
                        name: document.getElementById('fullName').value,
                        specialty: specialty,
                        city: city,
                        phone: fullPhone,
                        bio: bio,
                        location: city
                    });

                if (providerError) throw providerError;

                alert('تم ترقية حسابك بنجاح! 🎉 اهلا بك مقدم خدمة في خدمتي.');
                window.location.href = 'dashboard.html';

            } catch (err) {
                console.error('Upgrade error:', err);
                alert('حدث خطأ أثناء الترقية: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'ترقية الحساب';
            }
        }
    </script>
    <style>
        .readonly-input {
            background-color: #f8f9fa;
            cursor: not-allowed;
            color: #666;
        }
    </style>
</body>

</html>
