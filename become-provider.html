<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقية الحساب لمقدم خدمة - خدمتي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="premium-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark')</script>
    <style>
        /* Service Selector Styles */
        .categories-grid-small {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .category-card-small {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-card-small:hover {
            border-color: var(--primary);
            background: var(--primary-50);
        }

        .category-icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 5px;
        }

        .category-title {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .services-grid-selection {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .service-checkbox-item {
            cursor: pointer;
            position: relative;
        }

        .service-checkbox-item input {
            position: absolute;
            opacity: 0;
        }

        .service-checkbox-item .service-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            transition: all 0.2s;
            background: #f9fafb;
            font-size: 0.9rem;
            text-align: center;
            aspect-ratio: 1 / 1;
            height: 100%;
            white-space: normal;
            overflow: visible;
        }

        .service-checkbox-item .service-content:hover {
            border-color: #0d9488;
            background: #f0fdfa;
            transform: translateY(-2px);
        }

        .service-checkbox-item input:checked+.service-content {
            border-color: var(--primary, #0d9488);
            background: #f0fdfa;
            color: var(--primary, #0d9488);
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.1), 0 0 0 1px var(--primary, #0d9488);
        }

        .service-checkbox-item .service-icon {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .service-checkbox-item .service-name {
            font-size: 0.9rem;
            line-height: 1.2;
        }

        .dashboard-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .back-link-small {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            padding: 0;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="index.html" class="logo">
                        <span class="logo-icon">🛠️</span>
                        <span class="logo-text">خدمتي</span>
                    </a>
                    <h2>انضم كمقدم خدمة</h2>
                    <p>قم بترقية حسابك وابدأ باستقبال الطلبات</p>
                </div>

                <form id="upgradeForm" onsubmit="handleUpgrade(event)">
                    <div class="form-group">
                        <label>الاسم الكامل</label>
                        <input type="text" id="fullName" required readonly class="readonly-input">
                    </div>

                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <div class="phone-input-wrapper">
                            <input type="tel" id="phone" placeholder="790000000" pattern="[0-9]{9}" required>
                            <span class="country-code">+962</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>المهنة / التخصص</label>
                        <label>المهنة / التخصص</label>
                        <!-- Dynamic Service Selector -->
                        <div id="servicesSelector" class="services-selector">
                            <div class="loading-spinner">جاري تحميل الخدمات...</div>
                        </div>
                        <input type="hidden" id="specialty" required>
                    </div>

                    <div class="form-group">
                        <label>المدينة</label>
                        <select id="city" required>
                            <option value="">اختر المدينة...</option>
                            <option value="عمّان">عمّان</option>
                            <option value="إربد">إربد</option>
                            <option value="الزرقاء">الزرقاء</option>
                            <option value="العقبة">العقبة</option>
                            <option value="السلط">السلط</option>
                            <option value="مادبا">مادبا</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>المنطقة</label>
                        <select id="location" required>
                            <option value="">اختر المنطقة...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>نبذة عنك (اختياري)</label>
                        <textarea id="bio" placeholder="اكتب نبذة مختصرة عن خبرتك وخدماتك..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">ترقية الحساب</button>
                    <div class="auth-footer">
                        <a href="customer-dashboard.html">تراجع للوحة التحكم</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="supabaseClient.js"></script>
    <script src="locations.js"></script>
    <script src="categories.js"></script>
    <script src="script.js"></script>
    <script>
        // Check session and load user data
        let dashboardAllServices = [];
        let dashboardActiveCategory = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Check Auth
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            // 2. Load User Profile
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (profile) {
                document.getElementById('fullName').value = profile.full_name || '';
                if (profile.role === 'provider') {
                    alert('حسابك مفعل كمقدم خدمة بالفعل!');
                    window.location.href = 'dashboard.html';
                }
            }

            // 3. Load Services for Selector
            loadServicesForSignup();

            // 4. Setup City Logic
            const citySelect = document.getElementById('city');
            const locationSelect = document.getElementById('location');
            if (citySelect && locationSelect) {
                citySelect.addEventListener('change', () => {
                    const city = citySelect.value;
                    const neighborhoods = (window.neighborhoodsByCity && window.neighborhoodsByCity[city]) || [];
                    locationSelect.innerHTML = '<option value="">اختر المنطقة...</option>' +
                        neighborhoods.map(n => `<option value="${n}">${n}</option>`).join('');
                });
            }
        });

        async function loadServicesForSignup() {
            const selector = document.getElementById('servicesSelector');
            const { data: services, error } = await supabaseClient.from('service_stats').select('*');
            if (error || !services) {
                selector.innerHTML = '<p class="error">فشل تحميل الخدمات</p>';
                return;
            }
            dashboardAllServices = services;
            renderProviderCategories();
        }

        function renderProviderCategories() {
            const selector = document.getElementById('servicesSelector');
            const categoriesHtml = SERVICE_CATEGORIES.map(category => `
                <div class="category-card-small" onclick="openProviderCategory('${category.id}')">
                    <span class="category-icon">${category.icon}</span>
                    <span class="category-title">${category.title}</span>
                </div>
            `).join('');
            selector.innerHTML = `<div class="categories-grid-small">${categoriesHtml}</div>`;
        }

        function openProviderCategory(categoryId) {
            dashboardActiveCategory = categoryId;
            const category = SERVICE_CATEGORIES.find(c => c.id === categoryId);
            const selector = document.getElementById('servicesSelector');

            const filteredServices = dashboardAllServices.filter(service => {
                return category.keywords.some(keyword => service.name_ar.includes(keyword));
            });

            selector.innerHTML = `
                <div class="dashboard-section-header">
                    <button type="button" class="back-link-small" onclick="renderProviderCategories()">← رجوع للأقسام</button>
                    <span class="category-badge">${category.icon} ${category.title}</span>
                </div>
                <div class="services-grid-selection" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%">
                    ${filteredServices.map(service => `
                        <label class="service-checkbox-item">
                            <input type="radio" name="specialty_radio" value="${service.name_ar}" onchange="selectSpecialty('${service.name_ar}')">
                            <span class="service-content">${service.icon} ${service.name_ar}</span>
                        </label>
                    `).join('')}
                </div>
            `;
        }

        // Expose functions to window
        window.renderProviderCategories = renderProviderCategories;
        window.openProviderCategory = openProviderCategory;

        function selectSpecialty(value) {
            document.getElementById('specialty').value = value;
        }

        async function handleUpgrade(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'جاري الترقية...';

            const phone = document.getElementById('phone').value;
            const fullPhone = '+962' + phone;
            const specialty = document.getElementById('specialty').value;
            if (!specialty) {
                alert('يرجى اختيار التخصص/الخدمة');
                btn.disabled = false;
                btn.textContent = 'ترقية الحساب';
                return;
            }
            const city = document.getElementById('city').value;
            const bio = document.getElementById('bio').value;

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();

                // 1. Update Profile Role
                const { error: profileError } = await supabaseClient
                    .from('profiles')
                    .update({
                        role: 'provider',
                        phone: fullPhone
                    })
                    .eq('id', session.user.id);

                if (profileError) throw profileError;

                // 2. Insert into Providers
                const { error: providerError } = await supabaseClient
                    .from('providers')
                    .insert({
                        user_id: session.user.id,
                        name: document.getElementById('fullName').value,
                        specialty: specialty,
                        city: city,
                        phone: fullPhone,
                        bio: bio,
                        city: city,
                        phone: fullPhone,
                        bio: bio,
                        location: document.getElementById('location').value
                    });

                if (providerError) throw providerError;

                alert('تم ترقية حسابك بنجاح! 🎉 اهلا بك مقدم خدمة في خدمتي.');
                window.location.href = 'dashboard.html';

            } catch (err) {
                console.error('Upgrade error:', err);
                alert('حدث خطأ أثناء الترقية: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'ترقية الحساب';
            }
        }
    </script>
    <style>
        .readonly-input {
            background-color: #f8f9fa;
            cursor: not-allowed;
            color: #666;
        }
    </style>
    <script src="darkmode.js"></script>
</body>

</html>
