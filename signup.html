<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - خدمتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="premium-styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')</script>
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo">
                <span class="logo-icon">🛠️</span>
                <span class="logo-text">خدمتي</span>
            </a>

            <!-- Signup Form -->
            <div id="signupForm" class="auth-form active">
                <h1>إنشاء حساب</h1>
                <p class="auth-subtitle">انضم إلى خدمتي وابدأ رحلتك</p>

                <div class="user-type-toggle">
                    <button type="button" class="type-btn active" onclick="setUserType('customer', event)">👤
                        عميل</button>
                    <button type="button" class="type-btn" onclick="setUserType('provider', event)">🛠️ مقدم
                        خدمة</button>
                </div>

                <form onsubmit="handleSignup(event)">
                    <input type="hidden" id="userType" value="customer">

                    <div class="form-group">
                        <label>الاسم الكامل</label>
                        <input type="text" id="signupName" required placeholder="أحمد محمد">
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="signupEmail" required placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="signupPhone" required placeholder="07XXXXXXXX" pattern="07[0-9]{8}">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <div class="password-wrapper">
                            <input type="password" id="signupPassword" required placeholder="8 أحرف على الأقل"
                                minlength="8">
                            <button type="button" class="toggle-password"
                                onclick="togglePassword('signupPassword')">👁️</button>
                        </div>
                    </div>

                    <!-- Provider-specific fields -->
                    <div id="providerFields" class="provider-fields hidden">
                        <div class="form-group">
                            <label>التخصص</label>
                            <select id="providerSpecialty">
                                <option value="">اختر تخصصك</option>
                                <optgroup label="صيانة منزلية">
                                    <option value="سباكة">سباكة</option>
                                    <option value="كهرباء">كهرباء</option>
                                    <option value="تكييف">تكييف وتبريد</option>
                                    <option value="دهان">دهان وديكور</option>
                                    <option value="نجارة">نجارة</option>
                                    <option value="ألمنيوم">ألمنيوم</option>
                                    <option value="حدادة">حدادة</option>
                                    <option value="بلاط وسيراميك">بلاط وسيراميك</option>
                                    <option value="جبس وديكور">جبس وديكور</option>
                                    <option value="عزل مائي">عزل مائي</option>
                                    <option value="صيانة عامة">صيانة عامة</option>
                                </optgroup>
                                <optgroup label="تنظيف ومكافحة">
                                    <option value="تنظيف">تنظيف</option>
                                    <option value="مكافحة حشرات">مكافحة حشرات</option>
                                </optgroup>
                                <optgroup label="أجهزة منزلية">
                                    <option value="صيانة غسالات">صيانة غسالات</option>
                                    <option value="صيانة ثلاجات">صيانة ثلاجات</option>
                                    <option value="صيانة أفران">صيانة أفران</option>
                                    <option value="صيانة سخانات">صيانة سخانات</option>
                                </optgroup>
                                <optgroup label="تكنولوجيا">
                                    <option value="ستلايت">ستلايت</option>
                                    <option value="كاميرات مراقبة">كاميرات مراقبة</option>
                                    <option value="شبكات وانترنت">شبكات وانترنت</option>
                                    <option value="صيانة كمبيوتر">صيانة كمبيوتر</option>
                                    <option value="صيانة جوالات">صيانة جوالات</option>
                                </optgroup>
                                <optgroup label="سيارات">
                                    <option value="ميكانيك سيارات">ميكانيك سيارات</option>
                                    <option value="كهرباء سيارات">كهرباء سيارات</option>
                                    <option value="تلميع سيارات">تلميع سيارات</option>
                                    <option value="بنشر متنقل">بنشر متنقل</option>
                                </optgroup>
                                <optgroup label="خدمات شخصية">
                                    <option value="حلاقة منزلية">حلاقة منزلية</option>
                                    <option value="تجميل منزلي">تجميل منزلي</option>
                                    <option value="تمريض منزلي">تمريض منزلي</option>
                                    <option value="علاج طبيعي">علاج طبيعي</option>
                                    <option value="رعاية مسنين">رعاية مسنين</option>
                                    <option value="رعاية أطفال">رعاية أطفال</option>
                                </optgroup>
                                <optgroup label="تعليم وتدريب">
                                    <option value="دروس خصوصية">دروس خصوصية</option>
                                    <option value="تدريب رياضي">تدريب رياضي</option>
                                    <option value="تعليم قيادة">تعليم قيادة</option>
                                    <option value="تعليم سباحة">تعليم سباحة</option>
                                </optgroup>
                                <optgroup label="نقل وتوصيل">
                                    <option value="نقل أثاث">نقل أثاث</option>
                                    <option value="توصيل طلبات">توصيل طلبات</option>
                                </optgroup>
                                <optgroup label="خدمات أخرى">
                                    <option value="خياطة">خياطة</option>
                                    <option value="زراعة وحدائق">زراعة وحدائق</option>
                                    <option value="تصوير">تصوير</option>
                                    <option value="طبخ منزلي">طبخ منزلي</option>
                                    <option value="طاقة شمسية">طاقة شمسية</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>المدينة</label>
                            <select id="providerCity">
                                <option value="">اختر مدينتك</option>
                                <option value="عمّان">عمّان</option>
                                <option value="إربد">إربد</option>
                                <option value="الزرقاء">الزرقاء</option>
                                <option value="العقبة">العقبة</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>المنطقة</label>
                            <input type="text" id="providerLocation" placeholder="مثال: خلدا، الجبيهة">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="signupBtn">إنشاء الحساب</button>
                </form>

                <div class="auth-divider"><span>أو</span></div>

                <button class="btn btn-outline btn-block" onclick="signInWithGoogle()">
                    <span>🔵</span> المتابعة بحساب Google
                </button>

                <p class="auth-switch">
                    لديك حساب؟ <a href="login.html">تسجيل الدخول</a>
                </p>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="auth-form">
                <div class="success-icon">✅</div>
                <h1>تم بنجاح!</h1>
                <p class="auth-subtitle" id="successText">تم إنشاء حسابك. تحقق من بريدك الإلكتروني.</p>
                <a href="login.html" class="btn btn-primary btn-block">العودة لتسجيل الدخول</a>
            </div>
        </div>

        <div class="auth-decoration">
            <div class="decoration-shape"></div>
            <div class="decoration-text">
                <h2>منصة الخدمات الأولى في الأردن</h2>
                <p>أكثر من 5,000 مقدم خدمة موثوق</p>
            </div>
        </div>
    </div>

    <!-- Use the shared auth.js file! -->
    <script src="auth.js"></script>
    <script src="darkmode.js"></script>
</body>

</html>
